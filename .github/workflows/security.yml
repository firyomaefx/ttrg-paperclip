name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for sensitive files
        run: |
          # Fail if .env files are committed
          if find . -name ".env*" -not -name ".env.example" -not -path "*/node_modules/*" | grep -q .; then
            echo "ERROR: .env files found in repo. Remove them immediately!"
            exit 1
          fi
          # Fail if token files are committed
          if find . -name "*.token" -o -name "*.key" -o -name "*.secret" | grep -q .; then
            echo "ERROR: Token/key files found in repo. Remove them immediately!"
            exit 1
          fi
